name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run @opencode-ai/core tests
        id: core_tests
        timeout-minutes: 10
        run: |
          status=0
          start=$SECONDS
          GITHUB_ACTIONS=false bun turbo test --filter='@opencode-ai/core' --summarize -- --reporter=junit --reporter-outfile=core-test-results-primary.xml || status=$?
          elapsed=$((SECONDS - start))
          echo "::notice file=.github/workflows/test.yml,line=1,title=Package test duration::@opencode-ai/core#test ${elapsed}s (exit ${status})"
          echo "| @opencode-ai/core#test | ${elapsed}s | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Windows core failed once in 107s and passed in 90s on the next run.
      # Keep primary and rerun JUnit reports so any recurrence names the test.
      - name: Repeat Windows core tests with JUnit diagnostics
        id: core_diagnostics
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.core_tests.outcome == 'failure' }}
        timeout-minutes: 10
        working-directory: packages/core
        run: |
          test_status=0
          start=$SECONDS
          GITHUB_ACTIONS=false bun test --reporter=junit --reporter-outfile=core-test-results-rerun.xml || test_status=$?
          elapsed=$((SECONDS - start))
          echo "::notice file=.github/workflows/test.yml,line=1,title=Windows core diagnostic duration::@opencode-ai/core#test rerun ${elapsed}s (exit ${test_status})"
          echo "| @opencode-ai/core#test rerun | ${elapsed}s | ${test_status} |" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          reports = (
              "core-test-results-primary.xml",
              "core-test-results-rerun.xml",
          )
          existing = [report for report in reports if os.path.exists(report)]
          if not existing:
              print("::warning::Bun did not produce a core JUnit report")
              raise SystemExit(0)

          repo = os.path.abspath(os.path.join(os.getcwd(), "..", ".."))
          escape = lambda value: value.replace("%", "%25").replace("\\r", "%0D").replace("\\n", "%0A")
          for report in existing:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  path = case.get("file", "")
                  if os.path.isabs(path):
                      path = os.path.relpath(path, repo)
                  path = path.replace("\\", "/")
                  if not path.startswith("packages/"):
                      path = f"packages/core/{path}"
                  line = case.get("line", "1")
                  name = case.get("name", "unknown test")
                  detail = " ".join((failure.get("message", "") + " " + (failure.text or "")).split())
                  message = f"{report}: {name}: {detail}"[:3000]
                  title = "Windows core failure (primary)" if report.endswith("primary.xml") else "Windows core failure (rerun)"
                  print(f"::error file={escape(path)},line={line},title={title}::{escape(message)}")
          PY
          if [ "$test_status" -eq 0 ]; then
            echo "::warning title=Windows core diagnostic::The failed core test did not reproduce on the diagnostic rerun"
          else
            exit "$test_status"
          fi

      - name: Upload Windows core JUnit reports
        if: ${{ always() && runner.os == 'Windows' && (steps.core_tests.outcome == 'failure' || steps.core_diagnostics.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-core-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/core/core-test-results-primary.xml
            packages/core/core-test-results-rerun.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Run @opencode-ai/script tests
        id: script_tests
        timeout-minutes: 5
        run: |
          status=0
          start=$SECONDS
          GITHUB_ACTIONS=false bun turbo test --filter='@opencode-ai/script' --summarize -- --reporter=junit --reporter-outfile=ci-script-test-results.xml || status=$?
          elapsed=$((SECONDS - start))
          echo "::notice file=.github/workflows/test.yml,line=1,title=Package test duration::@opencode-ai/script#test ${elapsed}s (exit ${status})"
          echo "| @opencode-ai/script#test | ${elapsed}s | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "packages/script/ci-script-test-results.xml"
          if not os.path.exists(report):
              print("::warning::Bun did not produce the @opencode-ai/script JUnit report")
              raise SystemExit(0)

          repo = os.getcwd()
          escape = lambda value: value.replace("%", "%25").replace("\\r", "%0D").replace("\\n", "%0A")
          root = ET.parse(report).getroot()
          for case in root.iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is None:
                  continue
              path = case.get("file", "")
              if os.path.isabs(path):
                  path = os.path.relpath(path, repo)
              path = path.replace("\\", "/")
              if not path.startswith("packages/"):
                  path = f"packages/script/{path}"
              line = case.get("line", "1")
              name = case.get("name", "unknown test")
              detail = " ".join((failure.get("message", "") + " " + (failure.text or "")).split())
              message = f"{name}: {detail}"[:3000]
              print(f"::error file={escape(path)},line={line},title=@opencode-ai/script failure::{escape(message)}")
          PY
          exit "$status"

      - name: Upload Windows script JUnit report
        if: ${{ always() && runner.os == 'Windows' && steps.script_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-script-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/script/ci-script-test-results.xml
          if-no-files-found: warn
          retention-days: 7

      # Windows alphacode#test hit its 25m cap (Linux CI: 12m07). Local Turbo
      # splits maxed at 4m46; keep the prompt isolated and cap each group at 12m
      # with its own Windows timing for further adjustment if needed.
      - name: Run alphacode CLI tests
        id: cli_tests
        timeout-minutes: 12
        run: |
          status=0
          start=$SECONDS
          GITHUB_ACTIONS=false bun turbo run test:ci:cli --filter=alphacode --summarize -- --reporter=junit --reporter-outfile=ci-cli-test-results.xml || status=$?
          elapsed=$((SECONDS - start))
          echo "::notice file=.github/workflows/test.yml,line=1,title=Package test duration::alphacode#test:ci:cli ${elapsed}s (exit ${status})"
          echo "| alphacode#test:ci:cli | ${elapsed}s | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "packages/opencode/ci-cli-test-results.xml"
          if not os.path.exists(report):
              print("::warning::Bun did not produce the alphacode CLI JUnit report")
              raise SystemExit(0)

          repo = os.getcwd()
          escape = lambda value: value.replace("%", "%25").replace("\\r", "%0D").replace("\\n", "%0A")
          root = ET.parse(report).getroot()
          for case in root.iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is None:
                  continue
              path = case.get("file", "")
              if os.path.isabs(path):
                  path = os.path.relpath(path, repo)
              path = path.replace("\\", "/")
              if not path.startswith("packages/"):
                  path = f"packages/opencode/{path}"
              line = case.get("line", "1")
              name = case.get("name", "unknown test")
              detail = " ".join((failure.get("message", "") + " " + (failure.text or "")).split())
              message = f"{name}: {detail}"[:3000]
              print(f"::error file={escape(path)},line={line},title=Alphacode CLI failure::{escape(message)}")
          PY
          exit "$status"
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Upload Windows CLI JUnit report
        if: ${{ always() && runner.os == 'Windows' && steps.cli_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-cli-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/opencode/ci-cli-test-results.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Run alphacode server tests
        timeout-minutes: 12
        run: |
          status=0
          start=$SECONDS
          GITHUB_ACTIONS=false bun turbo run test:ci:server --filter=alphacode --summarize || status=$?
          elapsed=$((SECONDS - start))
          echo "::notice file=.github/workflows/test.yml,line=1,title=Package test duration::alphacode#test:ci:server ${elapsed}s (exit ${status})"
          echo "| alphacode#test:ci:server | ${elapsed}s | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Run alphacode session tests
        timeout-minutes: 12
        run: |
          status=0
          start=$SECONDS
          GITHUB_ACTIONS=false bun turbo run test:ci:session --filter=alphacode --summarize || status=$?
          elapsed=$((SECONDS - start))
          echo "::notice file=.github/workflows/test.yml,line=1,title=Package test duration::alphacode#test:ci:session ${elapsed}s (exit ${status})"
          echo "| alphacode#test:ci:session | ${elapsed}s | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Run remaining alphacode tests
        timeout-minutes: 12
        run: |
          status=0
          start=$SECONDS
          GITHUB_ACTIONS=false bun turbo run test:ci:rest --filter=alphacode --summarize || status=$?
          elapsed=$((SECONDS - start))
          echo "::notice file=.github/workflows/test.yml,line=1,title=Package test duration::alphacode#test:ci:rest ${elapsed}s (exit ${status})"
          echo "| alphacode#test:ci:rest | ${elapsed}s | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Run @opencode-ai/tui tests
        timeout-minutes: 8
        run: |
          status=0
          start=$SECONDS
          GITHUB_ACTIONS=false bun turbo test --filter='@opencode-ai/tui' --summarize || status=$?
          elapsed=$((SECONDS - start))
          echo "::notice file=.github/workflows/test.yml,line=1,title=Package test duration::@opencode-ai/tui#test ${elapsed}s (exit ${status})"
          echo "| @opencode-ai/tui#test | ${elapsed}s | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/opencode
        run: bun run test:httpapi
