name: Resolve upstream app sync

on:
  push:
    branches:
      - sync/upstream-app-tsx-resolution

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved app.tsx resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
          git fetch origin dev

          git show upstream/dev:packages/tui/src/app.tsx > packages/tui/src/app.tsx

          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/tui/src/app.tsx")
          text = path.read_text()

          # Preserve the AlphaCode-specific behavior identified during the conflict audit.
          text = text.replace('renderer.setTerminalTitle(`OC | ${title}`)', 'renderer.setTerminalTitle(`α | ${title}`)')
          text = text.replace('renderer.setTerminalTitle(`OC | ${route.data.id}`)', 'renderer.setTerminalTitle(`α | ${route.data.id}`)')
          text = text.replace('title: "Open docs",', 'title: "Open repository",')
          text = text.replace('open("https://opencode.ai/docs").catch(() => {})', 'open("https://github.com/mdev34-lab/alphacode").catch(() => {})')

          # Preserve AlphaCode's permission-mode binding if absent from upstream.
          if '"permission.mode",' not in text:
              needle = '  "app.toggle.session_directory_filter",\n'
              if needle not in text:
                  raise SystemExit("Could not restore AlphaCode permission.mode binding")
              text = text.replace(needle, needle + '  "permission.mode",\n', 1)

          # Preserve the upstream fatal-startup non-zero exit semantics.
          if 'process.exitCode = 1' not in text:
              needle = '    if (result.reason !== undefined)\n'
              replacement = '    if (result.reason !== undefined) {\n      process.exitCode = 1\n'
              if needle not in text:
                  raise SystemExit("Could not apply fatal-startup exit semantics")
              text = text.replace(needle, replacement, 1)
              marker = '      process.stderr.write((cliErrorMessage(result.reason) ?? errorFormat(result.reason)) + "\\n")\n'
              if marker not in text:
                  raise SystemExit("Could not close fatal-startup block")
              text = text.replace(marker, marker + '    }\n', 1)

          path.write_text(text)
          PY

          git add packages/tui/src/app.tsx
          git rm .github/workflows/resolve-upstream-app-sync.yml
          git commit -m "chore(tui): resolve upstream app.tsx sync"
          git push origin HEAD:sync/upstream-app-tsx-resolution
