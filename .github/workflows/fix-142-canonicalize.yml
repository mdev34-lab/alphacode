name: fix-142-canonicalize

on:
  push:
    branches:
      - fix/142-restore-slash-commands

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'fix: restore slash metadata canonically'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical slash metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          session = Path('packages/tui/src/routes/session/index.tsx')
          text = session.read_text()

          old = '''      value: "session.toggle.actions",\n      category: "Session",\n      run: () => {'''
          new = '''      value: "session.toggle.actions",\n      category: "Session",\n      slash: {\n        name: "details",\n      },\n      run: () => {'''
          if old not in text:
              raise SystemExit('details command registration pattern not found')
          text = text.replace(old, new, 1)

          old = '''      value: "session.toggle.activity",\n      category: "Session",\n      slash: {\n        name: "activity",\n      },'''
          new = '''      value: "session.toggle.activity",\n      category: "Session",\n      slash: {\n        name: "activity",\n        aliases: ["working"],\n      },'''
          if old not in text:
              raise SystemExit('activity command registration pattern not found')
          text = text.replace(old, new, 1)
          session.write_text(text)

          keymap = Path('packages/tui/src/keymap.tsx')
          text = keymap.read_text()
          text = re.sub(
              r'\nconst BUILTIN_SLASH_METADATA: Record<string, \{ name\?: string; aliases\?: string\[\] \}> = \{\n'
              r'  "session\.toggle\.actions": \{ name: "details" \},\n'
              r'  "session\.toggle\.activity": \{ aliases: \["working"\] \},\n\}\n',
              '\n',
              text,
              count=1,
          )

          old = '''    entries().flatMap((entry) => {\n      const metadata = BUILTIN_SLASH_METADATA[entry.command.name]\n      const slashName = metadata?.name ?? entry.command.slashName\n      if (typeof slashName !== "string" || !slashName) return []\n      const slashAliases = [\n        ...(Array.isArray(entry.command.slashAliases)\n          ? entry.command.slashAliases.filter((alias): alias is string => typeof alias === "string")\n          : []),\n        ...(metadata?.aliases ?? []),\n      ]'''
          new = '''    entries().flatMap((entry) => {\n      const slashName = entry.command.slashName\n      if (typeof slashName !== "string" || !slashName) return []\n      const slashAliases = entry.command.slashAliases'''
          if old not in text:
              raise SystemExit('keymap metadata workaround pattern not found')
          text = text.replace(old, new, 1)

          old = '''        aliases: slashAliases.length > 0 ? slashAliases.map((alias) => `/${alias}`) : undefined,'''
          new = '''        aliases: Array.isArray(slashAliases)\n          ? slashAliases.filter((alias): alias is string => typeof alias === "string").map((alias) => `/${alias}`)\n          : undefined,'''
          if old not in text:
              raise SystemExit('keymap alias formatting pattern not found')
          text = text.replace(old, new, 1)
          keymap.write_text(text)

          print('canonical slash metadata restored')
          PY

      - name: Verify diff
        run: git diff --check && git diff -- packages/tui/src/routes/session/index.tsx packages/tui/src/keymap.tsx

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/tui/src/routes/session/index.tsx packages/tui/src/keymap.tsx .github/workflows/fix-142-canonicalize.yml
          git commit -m "fix: restore slash metadata canonically"
          git rm .github/workflows/fix-142-canonicalize.yml
          git commit -m "chore: remove one-shot fix-142 migration"
          git push
