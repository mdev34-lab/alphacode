name: publish
run-name: "${{ inputs.dry_run && 'dry-run ' || '' }}release ${{ inputs.version || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto = derive from conventional commits since last tag"
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      version:
        description: "Override version, e.g. 0.2.0 (required for the first release)"
        required: false
        type: string
      dry_run:
        description: "Compute version + notes only; create nothing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'mdev34-lab/alphacode'
    steps:
      - name: Only release from dev
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/dev' }}
        run: |
          echo "::error::Releases can only be cut from dev (use dry_run elsewhere)"
          exit 1
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: ./.github/actions/setup-bun
      - id: version
        run: ./script/version.ts
        env:
          OPENCODE_BUMP: ${{ inputs.bump }}
          OPENCODE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build:
    needs: version
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: ./.github/actions/setup-bun
      - name: Build all targets and upload archives to the draft release
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
      - name: Attach install script
        run: gh release upload "${{ needs.version.outputs.tag }}" ./install --clobber

  finalize:
    needs: [version, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # Cleanup never deletes published releases; if a published release isn't latest, mark it latest manually.
      - run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --latest

  cleanup:
    needs: [version, build, finalize]
    if: ${{ failure() && !inputs.dry_run && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete leftover draft (never a published release)
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
